name: "Build KST HWBP Module"

on:
  workflow_dispatch:

env:
  KERNEL_REPO: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
  KERNEL_BRANCH: "liuqin-t-oss"
  # \u8bbe\u5907\u5b9e\u9645 uname -r \u7684\u672c\u5730\u540e\u7f00
  DEVICE_LOCALVERSION: "-android12-9-00003-gfb24cf99ad97-ab14313284"
  DEVICE_SUBLEVEL: "236"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install prerequisites"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 git curl zip unzip xz-utils cpio rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler \
            clang-12 lld-12 llvm-12
          ls -d /usr/lib/llvm-* 2>/dev/null || true

      - name: "Detect toolchain"
        run: |
          set -e
          TC=""
          for v in 12 14 15 16 17 18; do
            if [ -x "/usr/lib/llvm-$v/bin/clang" ]; then
              TC="/usr/lib/llvm-$v/bin"
              break
            fi
          done
          if [ -z "$TC" ]; then
            TC=$(dirname "$(readlink -f "$(which clang)")")
          fi
          echo "=== resolved TC=$TC ==="
          "$TC/clang" --version
          mkdir -p "$HOME/tcbin"
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            if [ -x "$TC/$t" ]; then ln -sf "$TC/$t" "$HOME/tcbin/$t"; fi
          done
          echo "$TC" >> "$GITHUB_PATH"
          echo "$HOME/tcbin" >> "$GITHUB_PATH"
          echo "TC=$TC" >> "$GITHUB_ENV"

      - name: "Clone kernel source"
        run: |
          set -e
          git clone --depth=1 --single-branch --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"
          head -6 Makefile
          du -sh .git

      - name: "Stub missing Kconfig files"
        run: |
          python3 "$GITHUB_WORKSPACE/stub_missing_kconfig.py" "$GITHUB_WORKSPACE/kernel"

      - name: "Force kernel version to match device"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          echo "=== before ==="
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) " Makefile
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = ${DEVICE_SUBLEVEL}/" Makefile
          echo "=== after ==="
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) " Makefile

      - name: "Apply device config"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$GITHUB_WORKSPACE/device_defconfig" "$GITHUB_WORKSPACE/out/.config"

          # \u2605 \u53bb\u6389 GKI ABI \u767d\u540d\u5355\u4f9d\u8d56\uff08\u6307\u5411 Google \u6784\u5efa\u673a\u7edd\u5bf9\u8def\u5f84\uff0c\u4e0d\u5b58\u5728\uff09
          sed -i '/^CONFIG_TRIM_UNUSED_KSYMS/d' "$GITHUB_WORKSPACE/out/.config"
          sed -i '/^CONFIG_UNUSED_KSYMS_WHITELIST/d' "$GITHUB_WORKSPACE/out/.config"
          echo "# CONFIG_TRIM_UNUSED_KSYMS is not set" >> "$GITHUB_WORKSPACE/out/.config"

          cd "$GITHUB_WORKSPACE/kernel"
          if ! make ARCH=arm64 LLVM=1 O="$GITHUB_WORKSPACE/out" olddefconfig; then
            echo "!!!!!!!!!! olddefconfig FAILED - falling back !!!!!!!!!!"
            ls arch/arm64/configs/ | head -40
            for d in $(ls arch/arm64/configs/ | grep -iE "liuqin|gki|vendor" | head -8); do
              n="${d%_defconfig}"
              echo "--- trying $n ---"
              if make ARCH=arm64 LLVM=1 O="$GITHUB_WORKSPACE/out" "${n}_defconfig"; then
                echo "OK: $n"
                break
              fi
            done
            sed -i '/^CONFIG_TRIM_UNUSED_KSYMS/d' "$GITHUB_WORKSPACE/out/.config"
            sed -i '/^CONFIG_UNUSED_KSYMS_WHITELIST/d' "$GITHUB_WORKSPACE/out/.config"
            echo "# CONFIG_TRIM_UNUSED_KSYMS is not set" >> "$GITHUB_WORKSPACE/out/.config"
          fi

          # \u2605 olddefconfig \u4e4b\u540e\u518d\u5f3a\u5236 LOCALVERSION\uff08\u907f\u514d\u88ab Kconfig \u9ed8\u8ba4\u503c\u8986\u76d6\uff09
          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"${DEVICE_LOCALVERSION}\"|" "$GITHUB_WORKSPACE/out/.config"
          sed -i 's|^CONFIG_LOCALVERSION_AUTO=.*|# CONFIG_LOCALVERSION_AUTO is not set|' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_LOCALVERSION=' "$GITHUB_WORKSPACE/out/.config" || \
            echo "CONFIG_LOCALVERSION=\"${DEVICE_LOCALVERSION}\"" >> "$GITHUB_WORKSPACE/out/.config"

          echo "=== key configs ==="
          grep -E "^CONFIG_(CFI_CLANG|SHADOW_CALL_STACK|MODVERSIONS|MODULE_SIG|LTO_CLANG|CC_IS_CLANG|TRIM_UNUSED_KSYMS)|^CONFIG_LOCALVERSION" \
            "$GITHUB_WORKSPACE/out/.config" || true
          cp "$GITHUB_WORKSPACE/out/.config" "$GITHUB_WORKSPACE/final_defconfig"

      - name: "modules_prepare"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          make -j$(nproc) ARCH=arm64 LLVM=1 O="$GITHUB_WORKSPACE/out" modules_prepare
          echo "=== resulting version ==="
          cat "$GITHUB_WORKSPACE/out/include/config/kernel.release" || true

      - name: "Build module"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          make -j$(nproc) ARCH=arm64 LLVM=1 O="$GITHUB_WORKSPACE/out" \
            M="$GITHUB_WORKSPACE/module" modules

      - name: "Patch CRCs and vermagic"
        run: |
          python3 "$GITHUB_WORKSPACE/patch_versions.py" $(find "$GITHUB_WORKSPACE/module" -name "*.ko")

      - name: "Inspect result"
        run: |
          echo "=== built artifacts ==="
          find "$GITHUB_WORKSPACE/module" -name "*.ko" -exec ls -la {} \;
          for f in $(find "$GITHUB_WORKSPACE/module" -name "*.ko"); do
            echo ""
            echo "########## $f ##########"
            echo "--- modinfo ---"
            llvm-objdump -s -j .modinfo "$f" 2>/dev/null | head -20 || true
            echo "--- sections ---"
            llvm-objdump -h "$f" | head -30 || true
            echo "--- undefined symbols ---"
            llvm-nm -u "$f" || true
          done

      - name: "Upload .ko"
        uses: actions/upload-artifact@v4
        with:
          name: ksthwbp-module
          path: |
            module/*.ko
            final_defconfig
          if-no-files-found: error
          retention-days: 30
